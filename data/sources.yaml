# Every organization costs one GitHub Search API request per edition. PR details
# are cached by URL and refreshed only when the PR changes.
window_hours: 24
timezone: Europe/Amsterdam
max_prs_per_organization: 60
front_page_stories: 5
briefs_limit: 18
release_horizon_days: 45
# Official-post events are selected by the editor, not by a code relevance
# score. A separate horizon keeps distant releases out while allowing major
# community dates such as Community Day to appear in time for planning.
event_horizon_days: 90

# Dates supplied directly by the publisher; carried into upcoming editions.
confirmed_events:
  # Home Assistant was founded September 17, 2013; update the age each year.
  - product: Home Assistant’s 13th birthday
    kind: Event
    date: "2026-09-17"
    accent: blue
  - product: OHF Summit · Lisbon
    kind: Event
    date: "2026-09-22"
    endDate: "2026-09-24"
    accent: blue

# Official editorial feeds are public and auditable. User-owned Google Alert
# feed URLs are read from GOOGLE_ALERT_FEEDS_JSON and never stored here.
feed_sources:
  - id: open-home-foundation-blog
    name: Open Home Foundation Blog
    kind: official
    desk: Open Home Foundation
    url: https://www.openhomefoundation.org/blog/feed.xml
    enabled: true
  - id: open-home-foundation-newsletter
    name: Open Home Foundation Newsletter
    kind: official
    desk: Open Home Foundation
    url: https://newsletter.openhomefoundation.org/rss/
    enabled: true
  - id: home-assistant-blog
    name: Home Assistant Blog
    kind: official
    desk: Home Assistant
    url: https://www.home-assistant.io/atom.xml
    enabled: true
  - id: home-assistant-developer-blog
    name: Home Assistant Developer Blog
    kind: official
    desk: Home Assistant Libraries
    url: https://developers.home-assistant.io/blog/rss.xml
    enabled: true
  - id: esphome-blog
    name: ESPHome Blog
    kind: official
    desk: ESPHome
    url: https://esphome.io/blog/rss.xml
    enabled: true
  - id: music-assistant-blog
    name: Music Assistant Blog
    kind: official
    desk: Music Assistant
    url: https://www.music-assistant.io/blog/rss.xml
    enabled: true
  # Nabu Casa publishes a first-party Atom feed with full news article bodies.
  - id: nabu-casa-news
    name: Nabu Casa News
    kind: official
    desk: Nabu Casa libraries
    url: https://www.nabucasa.com/news/feed.xml
    enabled: true
  - id: matter-js-announcements
    name: Matter.js Announcements
    kind: official
    desk: Matter.js
    url: https://github.com/matter-js/matter.js/discussions/categories/announcements.atom
    enabled: true

# GitHub Releases are fetched only for these deliberately selected public
# repositories. Keeping the list explicit controls API cost and release noise.
release_sources:
  - repository: home-assistant/core
    product: Home Assistant
    accent: blue
    include_prereleases: true
  - repository: hacs/integration
    product: HACS
    accent: blue
    include_prereleases: false
  - repository: esphome/esphome
    product: ESPHome
    accent: green
    include_prereleases: true
  - repository: music-assistant/server
    product: Music Assistant
    accent: rust
    include_prereleases: false
  - repository: zwave-js/zwave-js
    product: Z-Wave JS
    accent: blue
    include_prereleases: false
  - repository: matter-js/matter.js
    product: Matter.js
    accent: rust
    include_prereleases: false
  - repository: zigpy/zigpy
    product: Zigpy
    accent: green
    include_prereleases: false
  - repository: improv-wifi/sdk-cpp
    product: Improv Wi-Fi SDK
    accent: green
    include_prereleases: false

# These official release sources are warmed during beta and seed the mandatory
# headline on a scheduled stable release day.
release_preview_sources:
  - product: Home Assistant
    strategy: home_assistant_rc
    metadata_url: https://raw.githubusercontent.com/home-assistant/home-assistant.io/refs/heads/rc/_config.yml
    feed_url: https://rc.home-assistant.io/atom.xml
    enabled: true
  - product: ESPHome
    strategy: esphome_next
    metadata_url: https://raw.githubusercontent.com/esphome/esphome.io/refs/heads/next/data/version.json
    base_url: https://next.esphome.io/
    enabled: true
  # Music Assistant can be added here once its release-note preview URL is known.

organizations:
  - slug: home-assistant
    name: Home Assistant
    enabled: true
    weight: 1.35
    featured_repositories: [core, frontend, operating-system, supervisor, android, iOS]
  - slug: home-assistant-libs
    name: Home Assistant Libraries
    enabled: true
    weight: 1.1
    featured_repositories: []
  - slug: hacs
    name: HACS
    enabled: true
    weight: 1.1
    featured_repositories: [integration, frontend, documentation]
  - slug: OHF-Device-Database
    name: OHF Device Database
    enabled: true
    weight: 1.05
    featured_repositories: []
  - slug: esphome
    name: ESPHome
    enabled: true
    weight: 1.25
    featured_repositories: [esphome, esphome-docs, home-assistant-voice-pe]
  - slug: music-assistant
    name: Music Assistant
    enabled: true
    weight: 1.25
    featured_repositories: [server, frontend, client]
  - slug: Sendspin
    name: Sendspin
    enabled: true
    weight: 1.15
    featured_repositories: [spec, aiosendspin, sendspin-cpp, sendspin-js]
  - slug: OpenHomeFoundation
    name: Open Home Foundation
    enabled: true
    weight: 1.2
    featured_repositories: [roadmap, openhomefoundation.org]
  - slug: zigpy
    name: Zigpy
    enabled: true
    weight: 1.05
    featured_repositories: []
  - slug: zwave-js
    name: Z-Wave JS
    enabled: true
    weight: 1.1
    featured_repositories: [zwave-js]
  - slug: matter-js
    name: Matter.js
    enabled: true
    weight: 1.1
    featured_repositories: [matter.js]
  - slug: ohf-voice
    name: OHF Voice
    enabled: true
    weight: 1.15
    featured_repositories: []
  - slug: bluetooth-devices
    name: Bluetooth Devices
    enabled: true
    weight: 1.0
    featured_repositories: []
  - slug: improv-wifi
    name: Improv Wi-Fi
    enabled: true
    weight: 1.1
    featured_repositories: [website, sdk-cpp, sdk-serial-js, sdk-ble-js]
  - slug: NabuCasa
    name: Nabu Casa libraries
    enabled: true
    weight: 1.0
    featured_repositories: [hass-nabucasa, universal-silabs-flasher]

editorial:
  ignore_labels: [skip-news, internal]
  feature_labels: [feature, new-feature, enhancement]
  breaking_labels: [breaking-change, backwards-incompatible]
  dependency_authors: ["dependabot[bot]", "renovate[bot]", "pre-commit-ci[bot]"]
  high_signal_terms:
    - voice
    - matter
    - energy
    - dashboard
    - accessibility
    - security
    - bluetooth
    - zigbee
    - music
    - player
    - device
    - migration

# Editorial tracks are lenses, not quotas. Reporter agents consider every
# enabled track; the editor decides whether the evidence and recent cadence
# justify publishing it in a particular edition.
editorial_tracks:
  - slug: new-devices
    name: New devices and capabilities
    prompt: prompts/tracks/new-devices.md
    enabled: true
  - slug: releases
    name: Releases and betas
    prompt: prompts/tracks/releases.md
    enabled: true
  - slug: reliability
    name: Reliability and quality
    prompt: prompts/tracks/reliability.md
    enabled: true
  - slug: community
    name: Contributors and maintainers
    prompt: prompts/tracks/community.md
    enabled: true
  - slug: documentation
    name: Documentation and learning
    prompt: prompts/tracks/documentation.md
    enabled: true

release_cycles:
  - product: Home Assistant
    rule: first-wednesday
    beta_days_before: 7
    release_offset_days: 0
    accent: blue
  - product: ESPHome
    rule: first-wednesday
    beta_days_before: 14
    release_offset_days: 14
    accent: green

ai:
  # Override with OPENAI_MODEL without editing this file.
  model: gpt-5-mini
  reasoning_effort: medium
  max_parallel_reporters: 4
  max_history_queries_per_reporter: 6
